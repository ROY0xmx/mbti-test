    ENFJ: { title: "主人公", tag: "鼓舞人心的凝聚力核心", desc: "你天生擅长理解人、激励人，总能让身边的人感到被看见和被重视。你有强烈的责任感，愿意为集体付出，也善于协调不同立场。你在人群中像一束光，能带动气氛、凝聚共识。你需要警惕的是过度承担他人的情绪，以及忽视自己的需要。你值得被同样温柔地对待，学会接受帮助，不会削弱你的力量。" },
    ENFP: { title: "竞选者", tag: "热情洋溢的可能性探索者", desc: "你对生活充满热情，对人和新事物有天然的好奇。你善于建立连接，能在短时间内让陌生人感到亲近。你脑子里总有无数可能性，讨厌被束缚，渴望自由和新鲜感。你适合创意、传播和任何需要感染力的领域。你需要警惕的是三分钟热度和逃避承诺，以及因为太在意可能性而难以专注。把热情聚焦，你会走得更远。" },
    ISTJ: { title: "物流师", tag: "可靠踏实的秩序守护者", desc: "你重视承诺、规则和秩序，做事有条不紊，答应的事一定会做到。你不喜欢夸张和不确定，更相信经过验证的经验。你在团队中是那个让人放心的基石，默默把细节做到位。你需要警惕的是对新变化过于保守，以及把责任压在自己身上不轻易求助。适当拥抱变化，会让你的稳定更有弹性。" },
    ISFJ: { title: "守卫者", tag: "细致入微的温暖守护者", desc: "你细心、体贴，总能在细节中照顾到别人的需要。你重视传统和稳定，对亲近的人有强烈的责任感。你记得别人的喜好，默默付出，不习惯邀功。你在团队中是那个让氛围变暖的人。你需要警惕的是过度牺牲自己，以及因为害怕冲突而压抑真实感受。你的付出值得被看见，也值得被回报。" },
    ESTJ: { title: "总经理", tag: "务实高效的组织者", desc: "你目标明确、行动果断，善于把混乱的局面理出头绪。你重视效率和结果，讨厌拖沓和模糊。你在组织中天然适合管理和推进的角色，能把计划落到实处。你需要警惕的是过于强势和控制欲，以及忽视他人的情绪需求。在追求效率的同时留一点弹性，你的团队会更有凝聚力。" },
    ESFJ: { title: "执政官", tag: "热心周到的关系维系者", desc: "你重视和谐，乐于照顾他人，在社交中营造温暖氛围。你对人际关系有敏锐的感知，总能及时察觉谁需要帮助。你擅长组织聚会、维系关系，是朋友圈里的粘合剂。你需要警惕的是过度在意他人评价，以及为了和谐而委屈自己。你的善意需要边界，才不会变成消耗。" },
    ISTP: { title: "鉴赏家", tag: "冷静灵活的问题解决者", desc: "你动手能力强，喜欢通过实践理解事物。面对突发状况你冷静沉着，能快速找到解决办法。你不喜欢被规则束缚，偏好独立行动和自由空间。你对工具、机械和操作类事物有天然兴趣。你需要警惕的是情感表达上的疏离，以及因为追求自由而回避长期承诺。适当表达在乎，会让关系更稳固。" },
    ISFP: { title: "探险家", tag: "敏感而自由的生活美学家", desc: "你对美和感官体验有独特的品味，活在当下，重视真实感受。你温柔、随和，不喜欢冲突和束缚。你在创作、艺术和自然中找到平静，也善于用行动而非语言表达关心。你需要警惕的是逃避长期规划，以及因为害怕冲突而压抑自己。给生活一点结构，你的自由会更有底气。" },
    ESTP: { title: "企业家", tag: "精力充沛的行动派", desc: "你反应快、行动力强，在快节奏和充满变数的环境中如鱼得水。你善于抓住机会，喜欢直接沟通，不喜欢绕弯子。你对当下有敏锐的感知，能在压力下保持镇定。你需要警惕的是冲动和忽视长远后果，以及因为追求刺激而忽略身边人的感受。多一点耐心，你的行动力会更有方向。" },
    ESFP: { title: "表演者", tag: "热情洋溢的当下享受者", desc: "你热爱生活，感染力强，走到哪里都能带来笑声。你对氛围和人的情绪有天然的敏感度，善于让当下变得有趣。你享受成为焦点，也愿意为朋友带来快乐。你需要警惕的是逃避严肃规划和长期责任，以及因为追求即时满足而忽略后果。给快乐加一点方向，你的人生会更精彩。" }
  };

  const STORAGE_KEY = 'mbti_test_history_v1';

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function prepareQuestions(base, count) {
    const shuffledBase = shuffle(base).slice(0, count);
    return shuffledBase.map(q => ({
      text: q.text,
      options: shuffle(q.options).map(opt => ({ label: opt.label, value: opt.value }))
    }));
  }

  function getVersionQuestions(version) {
    if (version === 40) return prepareQuestions(SIMPLE_BASE, 40);
    if (version === 100) return prepareQuestions(NORMAL_BASE, 100);
    return prepareQuestions(DEEP_BASE, 200);
  }

  let currentVersion = 40;
  let questions = [];
  let currentQuestionIndex = 0;
  let answers = [];

  const quizArea = document.getElementById('quizArea');
  const resultArea = document.getElementById('resultArea');
  const counter = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');
  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resultType = document.getElementById('resultType');
  const resultTitle = document.getElementById('resultTitle');
  const resultTagline = document.getElementById('resultTagline');
  const dimsBar = document.getElementById('dimsBar');
  const resultDesc = document.getElementById('resultDesc');
  const restartBtn = document.getElementById('restartBtn');
  const historyToggle = document.getElementById('historyToggle');
  const historySection = document.getElementById('historySection');
  const historyList = document.getElementById('historyList');
  const historyClear = document.getElementById('historyClear');
  const versionTabs = document.querySelectorAll('.version-tab');

  function resetState(version) {
    currentVersion = version;
    questions = getVersionQuestions(version);
    currentQuestionIndex = 0;
    answers = new Array(questions.length).fill(null);
    quizArea.classList.remove('hidden');
    resultArea.classList.add('hidden');
    historySection.classList.add('hidden');
    versionTabs.forEach(tab => {
      tab.classList.toggle('active', parseInt(tab.dataset.version) === version);
    });
    renderQuestion();
  }

  function updateProgress() {
    const total = questions.length;
    const answered = answers.filter(a => a !== null).length;
    progressFill.style.width = (answered / total) * 100 + '%';
    counter.textContent = (currentQuestionIndex + 1) + ' / ' + total;
  }

  function renderQuestion() {
    const q = questions[currentQuestionIndex];
    questionText.textContent = q.text;
    const saved = answers[currentQuestionIndex];
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      if (saved !== null && saved === opt.value) btn.classList.add('selected');
      btn.innerHTML = '<span class="option-letter">' + String.fromCharCode(65 + idx) + '</span>' + opt.label;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        answers[currentQuestionIndex] = opt.value;
        updateProgress();
        updateNavButtons();
      });
      optionsContainer.appendChild(btn);
    });
    updateProgress();
    updateNavButtons();
  }

  function updateNavButtons() {
    prevBtn.disabled = currentQuestionIndex === 0;
    nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? '查看结果' : '下一题';
    const has = answers[currentQuestionIndex] !== null;
    if (!has && currentQuestionIndex < questions.length - 1) nextBtn.disabled = true;
    else nextBtn.disabled = false;
  }

  function goToNext() {
    if (currentQuestionIndex < questions.length - 1) {
      if (answers[currentQuestionIndex] === null) return;
      currentQuestionIndex++;
      renderQuestion();
    } else {
      showResult();
    }
  }

  function goToPrev() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      renderQuestion();
    }
  }

  function calculate() {
    const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    answers.forEach(v => { if (v && counts.hasOwnProperty(v)) counts[v]++; });
    const e = counts.E >= counts.I ? 'E' : 'I';
    const s = counts.S >= counts.N ? 'S' : 'N';
    const t = counts.T >= counts.F ? 'T' : 'F';
    const j = counts.J >= counts.P ? 'J' : 'P';
    return { type: e + s + t + j, counts };
  }

  function renderDims(counts) {
    const totalEI = counts.E + counts.I || 1;
    const totalSN = counts.S + counts.N || 1;
    const totalTF = counts.T + counts.F || 1;
    const totalJP = counts.J + counts.P || 1;
    const dims = [
      { left: 'E', right: 'I', lv: counts.E, rv: counts.I, l: (counts.E / totalEI) * 100 },
      { left: 'S', right: 'N', lv: counts.S, rv: counts.N, l: (counts.S / totalSN) * 100 },
      { left: 'T', right: 'F', lv: counts.T, rv: counts.F, l: (counts.T / totalTF) * 100 },
      { left: 'J', right: 'P', lv: counts.J, rv: counts.P, l: (counts.J / totalJP) * 100 }
    ];
    dimsBar.innerHTML = dims.map(d => (
      '<div class="dim-row">' +
        '<span class="dim-label">' + d.left + ' ' + d.right + '</span>' +
        '<div class="dim-track">' +
          '<div class="dim-fill-left" style="width:' + d.l + '%"></div>' +
          '<div class="dim-fill-right" style="width:' + (100 - d.l) + '%"></div>' +
        '</div>' +
        '<span class="dim-pct">' + Math.round(d.l) + '%</span>' +
      '</div>'
    )).join('');
  }

  function saveToHistory(type, version, counts) {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    history.unshift({
      type,
      version,
      counts,
      time: new Date().toLocaleString('zh-CN')
    });
    if (history.length > 20) history = history.slice(0, 20);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  function renderHistory() {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    if (!history.length) {
      historyList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
      return;
    }
    historyList.innerHTML = history.map(h => (
      '<div class="history-item">' +
        '<span class="h-type">' + h.type + ' · ' + (TYPE_DESC[h.type] ? TYPE_DESC[h.type].title : '') + '</span>' +
        '<span class="h-meta">' + h.version + '题 · ' + h.time + '</span>' +
      '</div>'
    )).join('');
  }

  function showResult() {
    if (answers.some(a => a === null)) {
      for (let i = 0; i < answers.length; i++) {
        if (answers[i] === null) {
          currentQuestionIndex = i;
          renderQuestion();
          return;
        }
      }
    }
    const { type, counts } = calculate();
    const info = TYPE_DESC[type] || { title: '探索者', tag: '独特的人格组合', desc: '你拥有独一无二的人格组合。' };
    resultType.textContent = type;
    resultTitle.textContent = info.title;
    resultTagline.textContent = info.tag;
    renderDims(counts);
    resultDesc.innerHTML = '<p>' + info.desc + '</p>' +
      '<h3>关于 ' + type + ' 的进一步解读</h3>' +
      '<p>在本次' + currentVersion + '题测试中，你的四个维度倾向分别为：' +
      'E/I 维度偏向 <strong>' + (counts.E >= counts.I ? '外向 E' : '内向 I') + '</strong>（E ' + counts.E + ' / I ' + counts.I + '）；' +
      'S/N 维度偏向 <strong>' + (counts.S >= counts.N ? '实感 S' : '直觉 N') + '</strong>（S ' + counts.S + ' / N ' + counts.N + '）；' +
      'T/F 维度偏向 <strong>' + (counts.T >= counts.F ? '思考 T' : '情感 F') + '</strong>（T ' + counts.T + ' / F ' + counts.F + '）；' +
      'J/P 维度偏向 <strong>' + (counts.J >= counts.P ? '判断 J' : '知觉 P') + '</strong>（J ' + counts.J + ' / P ' + counts.P + '）。' +
      '这些倾向共同塑造了你独特的认知与行为风格。</p>' +
      '<p>需要说明的是，MBTI 是一种自我认知的参考工具，而非对人的定义。同一种类型的人也会因成长经历、环境和当下状态而有很大差异。建议把测试结果当作一面镜子，用来观察自己的偏好，而不是给自己贴标签。</p>';
    quizArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    historySection.classList.add('hidden');
    saveToHistory(type, currentVersion, counts);
  }

  function restartTest() {
    currentQuestionIndex = 0;
    answers = new Array(questions.length).fill(null);
    resultArea.classList.add('hidden');
    quizArea.classList.remove('hidden');
    historySection.classList.add('hidden');
    renderQuestion();
  }

  versionTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const v = parseInt(tab.dataset.version);
      if (v !== currentVersion) resetState(v);
    });
  });

  nextBtn.addEventListener('click', goToNext);
  prevBtn.addEventListener('click', goToPrev);
  restartBtn.addEventListener('click', restartTest);

  historyToggle.addEventListener('click', () => {
    if (historySection.classList.contains('hidden')) {
      renderHistory();
      historySection.classList.remove('hidden');
    } else {
      historySection.classList.add('hidden');
    }
  });

  historyClear.addEventListener('click', () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    renderHistory();
  });

  resetState(40);
})();
</script>
</body>
